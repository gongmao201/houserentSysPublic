spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/house_rent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    name: hrent
    hikari:
      auto-commit: true
      #空闲连接超时时长
      idle-timeout: 60000
      #连接超时时长
      connection-timeout: 60000
      #最大生命周期，0不过期
      max-lifetime: 0
      #最小空闲连接数
      minimum-idle: 10
      #最大连接数量
      maximum-pool-size: 10

  # v2 上传：契约要求 ≤5MB，Spring Boot 默认 1MB 会在进入 Controller 前拦截
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # Flyway：V1–V6 顺序执行；老库非空时按 baseline 处理
  # baseline-version=0：空库/干净老库都从 V1 开始（V1 全是 IF NOT EXISTS）
  # 已手动跑过 V6 的库改成 6；半迁移库禁止自动，先恢复或回滚
  flyway:
    enabled: true           # 已验证：干净老库 baseline 0，空库直接 V1–V7
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: legacy 13 tables
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    table: flyway_schema_history
    placeholder-replacement: false

mybatis:
  mapper-locations: classpath:mapper/*/*.xml
  type-aliases-package: com.wt.hrentSystem.**.entity
  configuration:
    # 控制台打印 SQL 日志（原文件此处为非法键 log-impl=org，导致配置绑定失败）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 下划线自动映射为驼峰
    map-underscore-to-camel-case: true

sys:
  name: 房屋租赁管理系统
  id: 01

logging:
  level:
    com:
      wt:
        hrentSystem:
          common: debug
          hrent: debug
server:
  port: 8888
  servlet:
    context-path: /hrent

#分页配置
pageSize: 10
pageNo: 1

ip: 127.0.0.1

#文件配置（本地存储目录，默认取运行目录下的 static/images）
file:
  local: ./static/images
  picLocal: ./static/images
  visitLocal: localhost:8888/hrent/images

#JWT令牌配置
token:
  secret: ${JWT_SECRET:}
  expire-days: 7

#微信小程序配置（未配置时微信登录接口返回明确错误，不会伪造登录）
wechat:
  app-id: ${WECHAT_APP_ID}
