# hrent-api 告警规则（3 条）
# 指标来源：Spring Boot Actuator + Micrometer Prometheus 注册表
#   入口指标 http_server_requests_seconds_count  —— 带 uri/status 标签
#   连接池    hikaricp_connections_active / hikaricp_connections_max

groups:
  - name: hrent-api-availability
    rules:
      # 告警 1：服务不可用（抓不到指标 / 进程死了 / 端口不通）
      # up 由 Prometheus 自身产生，target 一次抓取失败即 0。
      - alert: HrentApiDown
        expr: up{job="hrent-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: hrent-api
        annotations:
          summary: "hrent-api 抓不到指标（服务可能已停止）"
          description: "job=hrent-api 连续 1 分钟 up=0，先查 8888 端口与 /hrent/actuator/health。"

      # 告警 2：5xx 比例过高（接口在报错，但进程还活着）
      # 分母为该 job 全部请求，分子为 status 5xx；5 分钟内 > 5% 且持续 5 分钟。
      - alert: HrentApiHigh5xxRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="hrent-api", status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{job="hrent-api"}[5m]))
          ) > 0.05
          and
          sum(rate(http_server_requests_seconds_count{job="hrent-api", status=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: hrent-api
        annotations:
          summary: "hrent-api 5xx 比例超过 5%"
          description: "近 5 分钟 5xx 请求占比 {{ $value | humanizePercentage }}，查 logs/w3app.out 与最近一次发布。"

      # 告警 3：数据库连接池接近打满（再涨就会 connection-timeout 60s 后 500）
      # 使用率 = 活跃连接 / 最大连接；> 90% 持续 5 分钟。
      - alert: HrentDbPoolSaturated
        expr: |
          (
            hikaricp_connections_active{job="hrent-api", pool="hrent-pool"}
            /
            hikaricp_connections_max{job="hrent-api", pool="hrent-pool"}
          ) > 0.9
        for: 5m
        labels:
          severity: warning
          service: hrent-api
          component: datasource
        annotations:
          summary: "hrent-api 数据库连接池使用率超过 90%"
          description: "pool=hrent-pool 活跃/最大 = {{ $value | humanizePercentage }}，先查慢 SQL 与长事务，再评估上调 maximum-pool-size。"
